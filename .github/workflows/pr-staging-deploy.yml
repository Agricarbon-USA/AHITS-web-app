name: Deploy PR to a preview service

# CC-30 / D16 — STAGING IS HOME.
#
# This workflow used to deploy ANY PR carrying the `deploy-staging` label straight
# onto ahits-web-app-staging: no verify job, no migration-safety, DISABLE_SW=true
# (which kills the offline queue's service worker for the whole fleet), that PR's
# migrations applied to the live database, and MIN_INSTANCES=0. That was tolerable
# when staging was a scratch environment. Under D16 the fleet operates on staging
# indefinitely, so it is production in everything but name and NOTHING may reach it
# except a reviewed merge.
#
# Therefore:
#   * the `pull_request: [labeled]` trigger is GONE — workflow_dispatch only;
#   * `service` is a REQUIRED input with no default, so a preview target is always
#     a deliberate choice rather than an inherited constant;
#   * a guard step hard-fails if the resolved service is the live one;
#   * the migrate step is REMOVED (see "Degraded preview" below).
#
# The ONLY path to ahits-web-app-staging is: merge to `development` → deploy.yml.
#
# ── Degraded preview (read before using this workflow) ───────────────────────────
# This workflow no longer runs `make cloud-run-migrate`. That step read
# AHITS_MIGRATE_URL — which under D16 is the PILOT database — and applying an
# unreviewed PR's migrations to the pilot DB is precisely the blast radius this
# packet exists to remove. A preview service deployed from here therefore points at
# whatever schema the shared DB already has: if your PR adds a migration, the preview
# will run against an UNMIGRATED schema and features touching new columns will error.
# That is a deliberate trade — a degraded preview beats a live-DB migration from an
# unreviewed branch. If you need a preview with its own schema, stand up a separate
# database and pass its secrets via a distinct SECRET_NS; do not point this at the
# pilot DB.

on:
  # Manual only. Example:
  #   gh workflow run pr-staging-deploy.yml -f pr_number=<N> -f service=ahits-web-app-preview
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: true
        type: number
      service:
        # No default — naming the target is always an explicit act (see header).
        description: 'Cloud Run service to deploy to. MUST NOT be ahits-web-app-staging (D16).'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy PR to a preview service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # FIRST step in the job: nothing is built, pushed, or deployed until the
      # target has been proven not to be a live service.
      - name: Guard — refuse to target the live service
        env:
          TARGET_SERVICE: ${{ inputs.service }}
        run: |
          # Normalize (strip whitespace, lowercase) so a stray space or capital
          # letter can't smuggle the live service name past a literal compare.
          normalized="$(printf '%s' "$TARGET_SERVICE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$normalized" ]; then
            echo "::error::REFUSING: pr-staging-deploy requires an explicit non-empty 'service' input."
            exit 1
          fi

          if [ "$normalized" = "ahits-web-app-staging" ] || [ "$normalized" = "ahits-web-app" ]; then
            echo "::error::REFUSING: pr-staging-deploy may never target ahits-web-app-staging (D16 — staging is home)"
            echo ""
            echo "  Requested service: '$TARGET_SERVICE'"
            echo "  The live fleet runs on ahits-web-app-staging; ahits-web-app is production."
            echo "  The only path to either is a reviewed merge (development → deploy.yml)."
            echo "  Pick a distinct preview service name, e.g. ahits-web-app-preview-<topic>."
            exit 1
          fi

          echo "✅ Target service '$TARGET_SERVICE' is not a live service — proceeding."

      - name: Resolve PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt(context.payload.inputs.pr_number);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', prNumber);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('sha', pr.head.sha);

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: GCP Auth & Docker Setup
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Build & push image
        run: |
          make docker-build TAG=pr-${{ steps.pr.outputs.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }} DISABLE_SW=true
          make docker-push  TAG=pr-${{ steps.pr.outputs.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}

      # NOTE: no `make cloud-run-migrate` step here — deliberately. See the
      # "Degraded preview" note in the header: previews must never migrate the
      # pilot database. Migrations reach a live DB only via deploy.yml, which
      # gates them behind verify + migration-safety.

      - name: Deploy to the preview service
        run: |
          make cloud-run-deploy \
            SERVICE=${{ inputs.service }} \
            TAG=pr-${{ steps.pr.outputs.sha }} \
            MIN_INSTANCES=0 \
            GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }} \
            EMAIL_SANDBOX=true

      - name: Get preview URL & comment on PR
        uses: actions/github-script@v7
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          TARGET_SERVICE: ${{ inputs.service }}
        with:
          script: |
            const { execSync } = require('child_process');
            const url = execSync(
              `make cloud-run-url SERVICE=${process.env.TARGET_SERVICE} GCP_PROJECT=${process.env.GCP_PROJECT}`
            ).toString().trim();

            const prNumber = ${{ steps.pr.outputs.number }};
            const shortSha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);

            // Replace any previous preview deploy comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of comments) {
              if (c.body.includes('<!-- staging-deploy -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '<!-- staging-deploy -->',
                '### 🚀 Preview deploy complete',
                `**URL:** ${url}`,
                `**Service:** \`${process.env.TARGET_SERVICE}\``,
                `**Commit:** \`${shortSha}\``,
                `**PR:** #${prNumber}`,
                '',
                '> ⚠️ Degraded preview: no migrations were applied (D16 — previews never migrate the pilot DB).',
                '> If this PR adds a migration, the preview runs against an unmigrated schema.',
              ].join('\n'),
            });
