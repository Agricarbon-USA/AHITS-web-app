name: Deploy to Cloud Run

on:
  push:
    branches:
      - production # → production
      - development # → staging

# Never run two deploys to the same target at once; queue the newest instead of
# racing them onto the same Cloud Run service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the deploy on the same checks PRs run, against the exact commit being
  # shipped. `deploy` will not start unless this passes.
  verify:
    uses: ./.github/workflows/verify.yml

  # NOTE: Auto-migration from GitHub Actions is not possible because GHA runners
  # cannot reach the Supabase direct connection (IPv6-only on this plan). Apply
  # migrations manually with `make db-migrate` before merging any PR that adds
  # a new migration. See CLAUDE.md §"Run Prisma locally before opening the PR".

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: GCP Auth & Docker Setup
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make deploy-prod TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make deploy-staging TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Show service URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make cloud-run-url SERVICE=ahits-web-app GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make cloud-run-url SERVICE=ahits-web-app-staging GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi
