name: Deploy to Cloud Run

on:
  push:
    branches:
      - production # → production
      - development # → staging

# Never run two deploys to the same target at once; queue the newest instead of
# racing them onto the same Cloud Run service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the deploy on the same checks PRs run, against the exact commit being
  # shipped. `deploy` will not start unless this passes.
  verify:
    uses: ./.github/workflows/verify.yml

  # Apply pending Prisma migrations to the target database BEFORE the new code
  # deploys. Runs only after verify passes; deploy runs only after this passes,
  # so code never ships against an unmigrated schema. Migrations must be
  # backward-compatible (expand/contract) since old code is still serving while
  # this runs. If the migration history is out of sync with the DB, this step
  # fails and blocks the deploy — by design.
  migrate:
    name: Apply DB migrations
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: GCP Auth
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Apply pending migrations to the target database
        run: make cloud-run-migrate GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}

  deploy:
    name: Build & Deploy
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: GCP Auth & Docker Setup
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make deploy-prod TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make deploy-staging TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Show service URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make cloud-run-url SERVICE=ahits-web-app GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make cloud-run-url SERVICE=ahits-web-app-staging GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi
