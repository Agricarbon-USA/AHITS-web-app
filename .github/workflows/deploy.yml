name: Deploy to Cloud Run

on:
  push:
    branches:
      - production # → production
      - development # → staging
    # A push that changes only documents does not deploy. Never copy this to
    # ci.yml: its checks are required on every PR and would hang as "Pending".
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'packets/**'

# Never run two deploys to the same target at once; queue the newest instead of
# racing them onto the same Cloud Run service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the deploy on the same checks PRs run, against the exact commit being
  # shipped. `deploy` will not start unless this passes.
  verify:
    uses: ./.github/workflows/verify.yml

  # CC-30 / D16: migration-safety on the LIVE branch, not just on PRs.
  #
  # Until now this gate lived ONLY in ci.yml (pull_request-triggered), so a direct
  # push to `development` skipped it entirely while the `migrate` job below happily
  # applied whatever it found to the pilot database. Under D16 `development` is an
  # environment-bearing branch; it gets the same gate production-targeting PRs get.
  #
  # CONSEQUENCE (intended): an *acknowledged* destructive migration can now reach a
  # live DB ONLY through a PR carrying the `destructive-migration-approved` label —
  # a direct push carrying one FAILS the deploy. That asymmetry is the point: the
  # label is a PR-only artifact, so the reviewed path is the only path.
  migration-safety:
    name: Backward-compatible migrations
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      actions: read         # find the last successful deploy run
      pull-requests: read   # read the labels of merged PRs
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the check compares HEAD with the last deployed commit.
          fetch-depth: 0

      - name: Check every migration since the last successful deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE="$(gh run list --workflow deploy.yml --branch "$TARGET_BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -z "$BASE" ]; then
            echo "::error::migration-safety: no deploy from '$TARGET_BRANCH' has ever succeeded, so there is nothing to compare with. This check stops here on purpose. A first deploy from this branch needs the owner and a change to this step."
            exit 1
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::migration-safety: the last deployed commit ${BASE} is not in this checkout. Tell the owner."
            exit 1
          fi
          # A label counts only when its merged PR changed prisma/migrations.
          MIG=" $(git rev-list "${BASE}..HEAD" -- prisma/migrations | tr '\n' ' ')"
          LABELS=""
          for sha in $(git rev-list "${BASE}..HEAD"); do
            FOUND="$(gh api "repos/${GH_REPO}/commits/${sha}/pulls" --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")')"
            case "$MIG" in
              *" ${sha} "*) LABELS="${LABELS},${FOUND}"; echo "migration-safety: ${sha} changes migrations; PR labels counted: '${FOUND}'" ;;
              *) echo "migration-safety: ${sha} changes no migration; PR labels not counted: '${FOUND}'" ;;
            esac
          done
          echo "migration-safety: checking ${BASE}..$(git rev-parse HEAD)"
          PR_LABELS="$LABELS" bash scripts/check-migration-safety.sh "$BASE"

  # Apply pending Prisma migrations to the target database BEFORE deploying.
  # The Supabase *direct* connection is IPv6-only (unreachable from IPv4-only GHA
  # runners), so this reads AHITS_MIGRATE_URL — the Supabase *session pooler*
  # (IPv4, port 5432, session mode), which is reachable from GHA and supports the
  # session semantics `prisma migrate deploy` requires (the 6543 transaction
  # pooler does NOT). Runs only after verify; deploy runs only after this — so
  # code never ships against an unmigrated schema. Migrations must be
  # backward-compatible (old code is still serving while this runs).
  migrate:
    name: Apply DB migrations
    # CC-30: gated on migration-safety too — a backward-incompatible migration must
    # not reach the live DB, and a failed gate means no deploy at all (deploy needs
    # migrate).
    needs: [verify, migration-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: GCP Auth
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Apply pending migrations to the target database
        # FND-15: migrate the DB that matches the branch. cloud-run-migrate reads
        # $(SECRET_NS)_MIGRATE_URL; without SECRET_NS a prod deploy would migrate
        # STAGING and then serve prod against an unmigrated schema.
        # Prereq: AHITS_PROD_MIGRATE_URL must exist in Secret Manager (prod session
        # pooler, port 5432, IPv4) before the first production deploy.
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make cloud-run-migrate SECRET_NS=AHITS_PROD GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make cloud-run-migrate GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi

  deploy:
    name: Build & Deploy
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: GCP Auth & Docker Setup
        uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make deploy-prod TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make deploy-staging TAG=${{ github.sha }} GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi

      # CC-30 / D16: prove the pilot config actually landed.
      #
      # `make cloud-run-deploy` uses --set-env-vars, which REPLACES the entire env
      # set on every deploy — so any value set by hand in the Cloud Run console dies
      # at the next merge, silently. Three settings are load-bearing for the pilot
      # and all three fail quietly when wrong: EMAIL_SANDBOX (off ⇒ real shops and
      # operators get emailed), EMAIL_SANDBOX_TO (empty ⇒ every sandboxed send is
      # logged SKIPPED and never raises EMAIL_FAILED), and minScale (0 ⇒ the fleet's
      # 6am first-open eats a cold start). A deploy that reverts any of them must go
      # RED, not green.
      #
      # Staging only: prod has its own posture (EMAIL_SANDBOX=false is the deliberate
      # cutover opt-out) and is not yet stood up — see DECISIONS.md D1.
      - name: Verify deployed env (staging pilot config)
        if: github.ref == 'refs/heads/development'
        run: |
          set -euo pipefail

          gcloud run services describe ahits-web-app-staging \
            --region us-central1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format json > /tmp/svc.json

          # Container env is a list of {name, value} objects — look up BY NAME, never
          # by index. `// empty` so a missing key yields "" rather than the string
          # "null".
          get_env() {
            jq -r --arg k "$1" \
              '[.spec.template.spec.containers[]?.env[]? | select(.name == $k) | .value] | first // empty' \
              /tmp/svc.json
          }

          EMAIL_SANDBOX_ACTUAL="$(get_env EMAIL_SANDBOX)"
          EMAIL_SANDBOX_TO_ACTUAL="$(get_env EMAIL_SANDBOX_TO)"

          # minScale is an ANNOTATION, and its value is a STRING ("1", not 1).
          # Absent annotation ⇒ empty ⇒ treated as drift, which is correct: no
          # annotation means Cloud Run's default of scale-to-zero.
          MIN_SCALE_ACTUAL="$(jq -r \
            '.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // empty' \
            /tmp/svc.json)"

          echo "Observed on ahits-web-app-staging:"
          echo "  EMAIL_SANDBOX    = '${EMAIL_SANDBOX_ACTUAL}'   (expected 'true')"
          echo "  EMAIL_SANDBOX_TO = '${EMAIL_SANDBOX_TO_ACTUAL}'   (expected non-empty)"
          echo "  minScale         = '${MIN_SCALE_ACTUAL}'   (expected '1')"

          drift=""
          [ "$EMAIL_SANDBOX_ACTUAL" = "true" ] || drift="${drift} EMAIL_SANDBOX(got='${EMAIL_SANDBOX_ACTUAL}',want='true')"
          [ -n "$EMAIL_SANDBOX_TO_ACTUAL" ]    || drift="${drift} EMAIL_SANDBOX_TO(got=EMPTY,want=non-empty)"
          [ "$MIN_SCALE_ACTUAL" = "1" ]        || drift="${drift} minScale(got='${MIN_SCALE_ACTUAL}',want='1')"

          if [ -n "$drift" ]; then
            echo "::error::env-drift on ahits-web-app-staging — the deploy did not land the pilot config. Mismatched keys:${drift}. Fix the Makefile's cloud-run-deploy/deploy-staging targets (console-set values do NOT survive --set-env-vars). See CC-30 / D16."
            exit 1
          fi

          echo "✅ env-drift check passed — pilot config is live."

      - name: Show service URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            make cloud-run-url SERVICE=ahits-web-app GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          else
            make cloud-run-url SERVICE=ahits-web-app-staging GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          fi
