name: Verify

# Single source of truth for pre-merge / pre-deploy checks.
# Called by ci.yml (on every PR) and by deploy.yml (before any deploy), so the
# exact commit that ships has been linted, type-checked, built, and tested.
on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-build:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # CC-23: component tests (jsdom + RTL) run here, in the DB-less job — they
      # render React/MUI and never touch a database (see vitest.config.ui.ts).
      - name: Component tests
        run: npm run test:ui

      # Exercise the real production build (Serwist + webpack) so build-only
      # failures are caught on the PR, not at deploy time inside Docker.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    name: Tests
    # Pinned so the preinstalled PostgreSQL 16 stays; ubuntu-latest can move.
    runs-on: ubuntu-24.04
    # Uses the runner's own Postgres instead of a service container: pulling the
    # image (Docker Hub, then public.ecr.aws) kept hitting registry rate/data limits.
    env:
      TEST_DB_URL: postgresql://test:test@localhost:5432/ahits_test
    steps:
      - name: Start the runner's PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE ROLE test WITH LOGIN SUPERUSER PASSWORD 'test';"
          sudo -u postgres createdb -O test ahits_test
          pg_isready -h localhost -p 5432
          psql "postgresql://test:test@localhost:5432/ahits_test" -c "SHOW server_version; SHOW timezone;"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
          DIRECT_URL: ${{ env.TEST_DB_URL }}

      - name: Apply Prisma schema to the test database
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
          DIRECT_URL: ${{ env.TEST_DB_URL }}

      # prisma db push derives the schema from schema.prisma and cannot create
      # partial (WHERE-clause) indexes — Prisma has no syntax for them. Apply the
      # FND-23 partial-unique indexes from the committed migrations so the invariant
      # constraints exist in the test DB and tests that violate them catch real bugs.
      - name: Apply FND-23 partial-unique indexes to test database
        run: |
          psql "${{ env.TEST_DB_URL }}" <<'SQL'
          CREATE UNIQUE INDEX IF NOT EXISTS "deployment_assignments_one_open_primary_per_operator"
            ON "deployment_assignments" ("operatorId")
            WHERE "role" = 'PRIMARY' AND "endedAt" IS NULL;
          CREATE UNIQUE INDEX IF NOT EXISTS "deployment_assignments_one_open_primary_per_rig"
            ON "deployment_assignments" ("rigId")
            WHERE "role" = 'PRIMARY' AND "endedAt" IS NULL;
          CREATE UNIQUE INDEX IF NOT EXISTS "deployment_assignments_one_open_secondary_per_rig_op"
            ON "deployment_assignments" ("rigId", "operatorId")
            WHERE "role" = 'SECONDARY' AND "endedAt" IS NULL;
          CREATE UNIQUE INDEX IF NOT EXISTS "rig_vehicles_one_open_per_vehicle"
            ON "rig_vehicles" ("vehicleId")
            WHERE "removedAt" IS NULL;
          SQL

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL_TEST: ${{ env.TEST_DB_URL }}
          DIRECT_URL_TEST: ${{ env.TEST_DB_URL }}
